<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Regions</title>

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/admin_style.css" />

    <style>
      .top-bar {
        display: flex;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .btn-home {
        background: #111827;
        color: #fff;
        padding: 10px;
        border-radius: 8px;
        text-decoration: none;
      }
      .edit-btn {
        background: #f39c12;
        color: #fff;
      }
      .delete-btn {
        background: #e74c3c;
        color: #fff;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card">
        <div class="top-bar">
          <h2>Regions</h2>
          <a href="/" class="btn-home">Home</a>
        </div>

        <select id="country" onchange="loadRegions()"></select>

        <input id="region_code" placeholder="Code (3 digits)" />
        <input id="region_name" placeholder="Region name" />

        <button class="btn-primary" onclick="save()">Save</button>
        <button class="btn-gray" onclick="reset()">Reset</button>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Code</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="body"></tbody>
        </table>
      </div>
    </div>

    <script src="/public/js/common.js"></script>
    <script>
      const API = "/api/regions";
      const COUNTRY_API = "/api/countries";

      let regions = [];
      let countries = [];
      let editCode = null;
      let currentCountry = null;

      // COUNTRIES LOAD
      async function loadCountries() {
        const r = await fetch(COUNTRY_API);
        const j = await r.json();

        countries = j.data || [];

        const sel = document.getElementById("country");
        sel.innerHTML = `<option value="">Select</option>`;

        countries.forEach((c) => {
          sel.innerHTML += `<option value="${c.code}">${c.name}</option>`;
        });
      }

      // REGIONS LOAD (by country)
      async function loadRegions() {
        const country = document.getElementById("country").value;
        currentCountry = country;

        if (!country) return;

        const r = await fetch(`${API}?country_code=${country}`);
        const j = await r.json();

        regions = j.data || [];
        render();
      }

      function render() {
        let html = "";

        regions.forEach((r, i) => {
          html += `
      <tr>
        <td>${i + 1}</td>
        <td>${r.name}</td>
        <td>${r.code}</td>
        <td>
          <button class="edit-btn" onclick="edit('${r.code}','${r.name}')">Edit</button>
          <button class="delete-btn" onclick="del('${r.code}')">Del</button>
        </td>
      </tr>`;
        });

        document.getElementById("body").innerHTML = html;
      }

      // SAVE (중복 체크 포함)
      async function save() {
        const name = document.getElementById("region_name").value.trim();
        const code = document.getElementById("region_code").value.trim();

        if (code.length !== 3) return alert("3자리 코드");

        // 중복 체크
        const exists = regions.find((r) => r.code === code);
        if (!editCode && exists) return alert("duplicate code");

        await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            country_code: currentCountry,
            code,
            name,
          }),
        });

        reset();
        loadRegions();
      }

      function edit(code, name) {
        editCode = code;
        document.getElementById("region_code").value = code;
        document.getElementById("region_name").value = name;
      }

      async function del(code) {
        await fetch(`${API}/${code}`, { method: "DELETE" });
        loadRegions();
      }

      function reset() {
        editCode = null;
        document.getElementById("region_code").value = "";
        document.getElementById("region_name").value = "";
      }

      loadCountries();

      window.onload = async () => {
        await verifyLogin();
      };
    </script>
  </body>
</html>
