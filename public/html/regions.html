<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regions Management</title>

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/admin_style.css" />

    <style>
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }

      @media (max-width: 768px) {
        .top-bar {
          flex-direction: column;
          align-items: stretch;
        }
      }

      .edit-btn {
        background: #f39c12;
        color: white;
        margin-right: 5px;
      }

      .delete-btn {
        background: #e74c3c;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- FORM -->
      <div class="card">
        <div class="top-bar">
          <h1 class="page-title">Regions Management | إدارة المناطق</h1>

          <a
            href="/"
            style="
              padding: 10px 14px;
              background: #111827;
              color: white;
              border-radius: 10px;
              text-decoration: none;
              font-size: 13px;
            "
          >
            Home | الرئيسية
          </a>
        </div>

        <div class="form-grid">
          <!-- COUNTRY -->
          <select id="country_code" onchange="changeCountry()">
            <option value="">Select Country</option>
          </select>

          <!-- REGION CODE -->
          <input id="region_code" type="text" placeholder="Region Code" />

          <!-- REGION NAME -->
          <input id="region_nm" type="text" placeholder="Region Name" />

          <button class="btn-primary" onclick="saveRegion()">
            Save Region
          </button>

          <button class="btn-gray" onclick="resetForm()">Reset</button>
        </div>
      </div>

      <!-- LIST -->
      <div class="card">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Country</th>
                <th>Region</th>
                <th>Code</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody id="regionBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const API = "/api/regions";
      const COUNTRY_API = "/api/countries";

      let countries = [];
      let regions = [];
      let editId = null;

      // =========================
      // INIT COUNTRY
      // =========================
      async function loadCountries() {
        const res = await fetch(COUNTRY_API);
        const result = await res.json();
        countries = result.data || [];

        const sel = document.getElementById("country_id");
        sel.innerHTML = `<option value="">Select Country</option>`;

        countries.forEach((c) => {
          sel.innerHTML += `<option value="${c.code}">${c.name}</option>`;
        });
      }

      // =========================
      // LOAD REGIONS BY COUNTRY
      // =========================
      async function loadRegions(country_code) {
        if (!country_code) {
          regions = [];
          render();
          return;
        }

        const res = await fetch(`${API}?country_code=${country_code}`);
        const result = await res.json();

        regions = result.data || [];
        render();
      }

      // =========================
      // SAVE
      // =========================
      async function saveRegion() {
        const country_code = document.getElementById("country_id").value;
        const name = document.getElementById("region_nm").value.trim();

        if (!country_code || !name) {
          alert("country & region required");
          return;
        }

        try {
          let res;

          if (editId) {
            res = await fetch(`${API}/${editId}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ name }),
            });
          } else {
            res = await fetch(API, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                country_code,
                name,
              }),
            });
          }

          const result = await res.json();

          if (!result.success) throw new Error(result.message);

          resetForm();
          loadRegions(country_code);
        } catch (err) {
          alert(err.message);
        }
      }

      // =========================
      // DELETE
      // =========================
      async function del(id) {
        await fetch(`${API}/${id}`, { method: "DELETE" });
        const country_code = document.getElementById("country_id").value;
        loadRegions(country_code);
      }

      // =========================
      // RENDER
      // =========================
      function render() {
        let html = "";

        regions.forEach((r, i) => {
          const c = countries.find((x) => x.code === r.country_code);

          html += `
      <tr>
        <td>${i + 1}</td>
        <td>${c ? c.name : "-"}</td>
        <td>${r.name}</td>
        <td>
          <button onclick="del('${r.code}')">Delete</button>
        </td>
      </tr>
    `;
        });

        document.getElementById("regionBody").innerHTML = html;
      }

      // =========================
      // EVENT: COUNTRY CHANGE
      // =========================
      document.getElementById("country_id").addEventListener("change", (e) => {
        loadRegions(e.target.value);
      });

      // =========================
      // RESET
      // =========================
      function resetForm() {
        editId = null;
        document.getElementById("region_nm").value = "";
      }

      // INIT
      loadCountries();
    </script>
  </body>
</html>
