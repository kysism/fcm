<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Regions Management</title>

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/admin_style.css" />

    <style>
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }

      .edit-btn {
        background: #f39c12;
        color: white;
      }

      .delete-btn {
        background: #e74c3c;
        color: white;
      }

      @media (max-width: 768px) {
        .top-bar {
          flex-direction: column;
          align-items: stretch;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- FORM -->
      <div class="card">
        <div class="top-bar">
          <h1 class="page-title">Regions Management | إدارة المناطق</h1>

          <a
            href="/"
            style="
              padding: 10px 14px;
              background: #111827;
              color: white;
              border-radius: 10px;
              text-decoration: none;
              font-size: 13px;
            "
          >
            Home | الرئيسية
          </a>
        </div>

        <div class="form-grid">
          <select id="country_code">
            <option value="">Select Country</option>
          </select>

          <input id="region_code" type="text" placeholder="Region Code" />

          <input id="region_nm" type="text" placeholder="Region Name" />

          <button class="btn-primary" onclick="saveRegion()">
            Save Region
          </button>

          <button class="btn-gray" onclick="resetForm()">Reset</button>
        </div>
      </div>

      <!-- LIST -->
      <div class="card">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Country</th>
                <th>Region</th>
                <th>Code</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody id="regionBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const COUNTRY_API = "/api/countries";

      const REGION_API = "/api/regions";

      let countries = [];

      let regions = [];

      let editCode = null;

      // =========================
      // LOAD COUNTRIES
      // =========================
      async function loadCountries() {
        try {
          const res = await fetch(COUNTRY_API);

          const result = await res.json();

          countries = result.data || [];

          const sel = document.getElementById("country_code");

          sel.innerHTML =
            `<option value="">Select Country</option>` +
            countries
              .map((c) => `<option value="${c.code}">${c.name}</option>`)
              .join("");
        } catch (err) {
          console.error(err);
        }
      }

      // =========================
      // LOAD REGIONS
      // =========================
      async function loadRegions() {
        try {
          const res = await fetch(REGION_API);

          const result = await res.json();

          regions = result.data || [];

          render();
        } catch (err) {
          console.error(err);
        }
      }

      // =========================
      // RENDER
      // =========================
      function render() {
        let html = "";

        regions.forEach((r, i) => {
          const country = countries.find((c) => c.code === r.country_code);

          html += `
            <tr>
              <td>${i + 1}</td>

              <td>${country ? country.name : "-"}</td>

              <td>${r.name}</td>

              <td>${r.code}</td>

              <td>
                <button
                  class="edit-btn"
                  onclick="editRegion(
                    '${r.code}',
                    '${r.country_code}',
                    '${r.name}'
                  )"
                >
                  Edit
                </button>

                <button
                  class="delete-btn"
                  onclick="deleteRegion('${r.code}')"
                >
                  Delete
                </button>
              </td>
            </tr>
          `;
        });

        document.getElementById("regionBody").innerHTML = html;
      }

      // =========================
      // SAVE
      // =========================
      async function saveRegion() {
        const code = document
          .getElementById("region_code")
          .value.trim()
          .toUpperCase();

        const country_code = document.getElementById("country_code").value;

        const name = document.getElementById("region_nm").value.trim();

        if (!code || !country_code || !name) {
          alert("All fields required");
          return;
        }

        try {
          let response;

          // UPDATE
          if (editCode) {
            response = await fetch(`${REGION_API}/${editCode}`, {
              method: "PUT",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                country_code,
                name,
              }),
            });
          }

          // INSERT
          else {
            response = await fetch(REGION_API, {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                code,
                country_code,
                name,
              }),
            });
          }

          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error(result.message);
          }

          alert("Saved");

          resetForm();

          loadRegions();
        } catch (err) {
          console.error(err);

          alert(err.message);
        }
      }

      // =========================
      // EDIT
      // =========================
      function editRegion(code, countryCode, name) {
        editCode = code;

        document.getElementById("region_code").value = code;

        document.getElementById("country_code").value = countryCode;

        document.getElementById("region_nm").value = name;
      }

      // =========================
      // DELETE
      // =========================
      async function deleteRegion(code) {
        if (!confirm("Delete region?")) return;

        try {
          const response = await fetch(`${REGION_API}/${code}`, {
            method: "DELETE",
          });

          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error(result.message);
          }

          alert("Deleted");

          loadRegions();
        } catch (err) {
          console.error(err);

          alert(err.message);
        }
      }

      // =========================
      // RESET
      // =========================
      function resetForm() {
        editCode = null;

        document.getElementById("region_code").value = "";

        document.getElementById("country_code").value = "";

        document.getElementById("region_nm").value = "";
      }

      // INIT
      loadCountries();

      loadRegions();
    </script>
  </body>
</html>
