<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regions Management</title>

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/admin_style.css" />

    <style>
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }

      @media (max-width: 768px) {
        .top-bar {
          flex-direction: column;
          align-items: stretch;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card">
        <div class="top-bar">
          <h1>Regions Management</h1>

          <a
            href="/"
            style="
              padding: 10px 14px;
              background: #111827;
              color: white;
              border-radius: 10px;
              text-decoration: none;
            "
          >
            Home
          </a>
        </div>

        <div class="form-grid">
          <select id="country_id">
            <option value="">Select Country</option>
          </select>

          <input id="region_nm" placeholder="Region Name" />

          <button class="btn-primary" onclick="saveRegion()">Save</button>
          <button class="btn-gray" onclick="resetForm()">Reset</button>
        </div>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Country</th>
              <th>Region</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="regionBody"></tbody>
        </table>
      </div>
    </div>

    <script>
      const API = "/api/regions";
      const COUNTRY_API = "/api/countries";

      let countries = [];
      let regions = [];

      let editId = null;
      let currentCountry = null;

      // =========================
      // INIT
      // =========================
      document.addEventListener("DOMContentLoaded", async () => {
        await loadCountries();

        document
          .getElementById("country_id")
          .addEventListener("change", (e) => {
            currentCountry = e.target.value;
            loadRegions(currentCountry);
          });
      });

      // =========================
      // LOAD COUNTRIES
      // =========================
      async function loadCountries() {
        const res = await fetch(COUNTRY_API);
        const result = await res.json();

        countries = result.data || [];

        const sel = document.getElementById("country_id");
        sel.innerHTML = `<option value="">Select Country</option>`;

        countries.forEach((c) => {
          sel.innerHTML += `<option value="${c.code}">${c.name}</option>`;
        });
      }

      // =========================
      // LOAD REGIONS (BY COUNTRY)
      // =========================
      async function loadRegions(country_code) {
        if (!country_code) {
          regions = [];
          render();
          return;
        }

        const res = await fetch(`${API}?country_code=${country_code}`);
        const result = await res.json();

        regions = result.data || [];
        render();
      }

      // =========================
      // SAVE (CREATE / UPDATE)
      // =========================
      async function saveRegion() {
        const country_code = document.getElementById("country_id").value;
        const name = document.getElementById("region_nm").value.trim();

        if (!country_code || !name) {
          alert("country & region required");
          return;
        }

        try {
          let res;

          if (editId) {
            res = await fetch(`${API}/${editId}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ name }),
            });
          } else {
            res = await fetch(API, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                country_code,
                name,
              }),
            });
          }

          const result = await res.json();

          if (!result.success) throw new Error(result.message);

          resetForm();
          loadRegions(country_code);
        } catch (err) {
          alert(err.message);
        }
      }

      // =========================
      // DELETE
      // =========================
      async function deleteRegion(id) {
        await fetch(`${API}/${id}`, { method: "DELETE" });
        loadRegions(currentCountry);
      }

      // =========================
      // RENDER
      // =========================
      function render() {
        let html = "";

        regions.forEach((r, i) => {
          const c = countries.find((x) => x.code === r.country_code);

          html += `
            <tr>
              <td>${i + 1}</td>
              <td>${c ? c.name : "-"}</td>
              <td>${r.name}</td>
              <td>
                <button onclick="deleteRegion('${r.code}')">Delete</button>
              </td>
            </tr>
          `;
        });

        document.getElementById("regionBody").innerHTML = html;
      }

      // =========================
      // RESET
      // =========================
      function resetForm() {
        editId = null;
        document.getElementById("region_nm").value = "";
      }
    </script>
  </body>
</html>
