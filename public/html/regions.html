<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regions Management</title>

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/admin_style.css" />

    <style>
      .top-bar {
        display: flex;
        justify-content: space-between;
        margin-bottom: 16px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card">
        <div class="top-bar">
          <h2>Regions Management</h2>
          <a href="/">Home</a>
        </div>

        <div class="form-grid">
          <select id="country_id">
            <option value="">Select Country</option>
          </select>

          <input
            id="region_code"
            maxlength="3"
            placeholder="Region Code (3 chars)"
          />

          <input id="region_nm" placeholder="Region Name" />

          <button onclick="saveRegion()">Save</button>
          <button onclick="resetForm()">Reset</button>
        </div>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Code</th>
              <th>Country</th>
              <th>Region</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="regionBody"></tbody>
        </table>
      </div>
    </div>

    <script>
      const API = "/api/regions";
      const COUNTRY_API = "/api/countries";
      const CHECK_API = "/api/regions/check"; // ⭐ 추가

      let countries = [];
      let regions = [];
      let currentCountry = "";

      // =====================
      // INIT
      // =====================
      document.addEventListener("DOMContentLoaded", async () => {
        await loadCountries();

        document
          .getElementById("country_id")
          .addEventListener("change", (e) => {
            currentCountry = e.target.value;
            loadRegions(currentCountry);
          });
      });

      // =====================
      // COUNTRIES
      // =====================
      async function loadCountries() {
        const res = await fetch(COUNTRY_API);
        const result = await res.json();

        countries = result.data || [];

        const sel = document.getElementById("country_id");
        sel.innerHTML = `<option value="">Select Country</option>`;

        countries.forEach((c) => {
          sel.innerHTML += `<option value="${c.code}">${c.name}</option>`;
        });
      }

      // =====================
      // REGIONS LOAD
      // =====================
      async function loadRegions(country_code) {
        if (!country_code) {
          regions = [];
          render();
          return;
        }

        const res = await fetch(`${API}?country_code=${country_code}`);
        const result = await res.json();

        regions = result.data || [];
        render();
      }

      // =====================
      // SAVE + DUP CHECK
      // =====================
      async function saveRegion() {
        const country_code = document.getElementById("country_id").value;
        const code = document
          .getElementById("region_code")
          .value.trim()
          .toUpperCase();
        const name = document.getElementById("region_nm").value.trim();

        if (!country_code || !code || !name) {
          alert("All fields required");
          return;
        }

        if (code.length !== 3) {
          alert("Code must be 3 characters");
          return;
        }

        // ⭐ 중복 체크
        const checkRes = await fetch(`${CHECK_API}?code=${code}`);
        const check = await checkRes.json();

        if (check.exists) {
          alert("Code already exists!");
          return;
        }

        const res = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            code,
            country_code,
            name,
          }),
        });

        const result = await res.json();

        if (!result.success) {
          alert(result.message);
          return;
        }

        resetForm();
        loadRegions(country_code);
      }

      // =====================
      // DELETE
      // =====================
      async function del(code) {
        await fetch(`${API}/${code}`, { method: "DELETE" });
        loadRegions(currentCountry);
      }

      // =====================
      // RENDER
      // =====================
      function render() {
        let html = "";

        regions.forEach((r, i) => {
          const c = countries.find((x) => x.code === r.country_code);

          html += `
            <tr>
              <td>${i + 1}</td>
              <td>${r.code}</td>
              <td>${c ? c.name : "-"}</td>
              <td>${r.name}</td>
              <td>
                <button onclick="del('${r.code}')">Delete</button>
              </td>
            </tr>
          `;
        });

        document.getElementById("regionBody").innerHTML = html;
      }

      function resetForm() {
        document.getElementById("region_code").value = "";
        document.getElementById("region_nm").value = "";
      }
    </script>
  </body>
</html>
