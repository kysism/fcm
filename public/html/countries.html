<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Countries Management</title>

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/admin_style.css" />

    <style>
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }

      @media (max-width: 768px) {
        .top-bar {
          flex-direction: column;
          align-items: stretch;
        }
      }

      .edit-btn {
        background: #f39c12;
        color: white;
        margin-right: 5px;
      }

      .delete-btn {
        background: #e74c3c;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- FORM -->
      <div class="card">
        <div class="top-bar">
          <h1 class="page-title">Countries Management | إدارة الدول</h1>

          <a
            href="/"
            style="
              padding: 10px 14px;
              background: #111827;
              color: white;
              border-radius: 10px;
              text-decoration: none;
              font-size: 13px;
            "
          >
            Home | الرئيسية
          </a>
        </div>

        <div class="form-grid">
          <input
            id="country_nm"
            type="text"
            placeholder="Country Name | اسم الدولة"
          />

          <input
            id="country_code"
            type="text"
            placeholder="Country Code | رمز الدولة"
          />

          <button class="btn-primary" onclick="saveCountry()">
            Save Country | 저장
          </button>

          <button class="btn-gray" onclick="resetForm()">Reset | 초기화</button>
        </div>
      </div>

      <!-- LIST -->
      <div class="card">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Country</th>
                <th>Code</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody id="countryBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const API = "/api/countries";

      let countries = [];
      let editCode = null;

      // =========================
      // LOAD
      // =========================
      async function loadCountries() {
        try {
          const res = await fetch(API);

          const result = await res.json();

          countries = result.data || [];

          render();
        } catch (err) {
          console.error(err);
          alert("Load Error");
        }
      }

      // =========================
      // RENDER
      // =========================
      function render() {
        let html = "";

        countries.forEach((c, i) => {
          html += `
            <tr>
              <td>${i + 1}</td>

              <td>${c.name}</td>

              <td>${c.code}</td>

              <td>
                <button
                  class="edit-btn"
                  onclick="editCountry('${c.code}', '${c.name}')"
                >
                  Edit
                </button>

                <button
                  class="delete-btn"
                  onclick="deleteCountry('${c.code}')"
                >
                  Delete
                </button>
              </td>
            </tr>
          `;
        });

        document.getElementById("countryBody").innerHTML = html;
      }

      // =========================
      // SAVE
      // =========================
      async function saveCountry() {
        const name = document.getElementById("country_nm").value;

        const code = document.getElementById("country_code").value;

        if (!name || !code) {
          alert("Input Required");
          return;
        }

        try {
          // UPDATE
          if (editCode) {
            await fetch(`${API}/${editCode}`, {
              method: "PUT",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                name,
              }),
            });
          }

          // INSERT
          else {
            await fetch(API, {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                code,
                name,
              }),
            });
          }

          resetForm();

          loadCountries();
        } catch (err) {
          console.error(err);

          alert("Save Error");
        }
      }

      // =========================
      // EDIT
      // =========================
      function editCountry(code, name) {
        editCode = code;

        document.getElementById("country_code").value = code;

        document.getElementById("country_code").disabled = true;

        document.getElementById("country_nm").value = name;
      }

      // =========================
      // DELETE
      // =========================
      async function deleteCountry(code) {
        if (!confirm("Delete this country?")) return;

        try {
          await fetch(`${API}/${code}`, {
            method: "DELETE",
          });

          loadCountries();
        } catch (err) {
          console.error(err);

          alert("Delete Error");
        }
      }

      // =========================
      // RESET
      // =========================
      function resetForm() {
        editCode = null;

        document.getElementById("country_nm").value = "";

        document.getElementById("country_code").value = "";

        document.getElementById("country_code").disabled = false;
      }

      // INIT
      loadCountries();
    </script>
  </body>
</html>
