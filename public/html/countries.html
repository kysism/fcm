<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Countries Management</title>

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/admin_style.css" />

    <style>
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }

      @media (max-width: 768px) {
        .top-bar {
          flex-direction: column;
          align-items: stretch;
        }
      }

      .edit-btn {
        background: #f39c12;
        color: white;
        margin-right: 5px;
      }

      .delete-btn {
        background: #e74c3c;
        color: white;
      }

      .mobile-card {
        display: none;
      }

      .country-box {
        border: 1px solid #eee;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 10px;
        background: #fafafa;
      }

      .small {
        font-size: 12px;
        opacity: 0.75;
        margin-top: 4px;
      }

      @media (max-width: 768px) {
        table {
          display: none;
        }

        .mobile-card {
          display: block;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- FORM -->
      <div class="card">
        <div class="top-bar">
          <h1 class="page-title">Countries Management</h1>

          <a
            href="/"
            style="
              padding: 10px 14px;
              background: #111827;
              color: white;
              border-radius: 10px;
              text-decoration: none;
              font-size: 13px;
            "
          >
            Home
          </a>
        </div>

        <div class="form-grid">
          <input id="country_nm" type="text" placeholder="Country Name" />

          <input id="country_code" type="text" placeholder="Country Code" />

          <button type="button" class="btn-primary" onclick="saveCountry()">
            Save Country
          </button>

          <button type="button" class="btn-gray" onclick="resetForm()">
            Reset
          </button>
        </div>
      </div>

      <!-- LIST -->
      <div class="card">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Country</th>
                <th>Code</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody id="countryBody"></tbody>
          </table>
        </div>

        <!-- MOBILE -->
        <div id="mobileBody" class="mobile-card"></div>
      </div>
    </div>

    <script src="/html/js/common.js"></script>
    <script>
      const API = "/api/countries";

      let countries = [];

      let editCode = null;

      let saving = false;

      // =========================
      // ESCAPE HTML
      // =========================
      function escapeHtml(str = "") {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      // =========================
      // LOAD
      // =========================
      async function loadCountries() {
        try {
          const res = await fetch(API);

          if (!res.ok) {
            throw new Error("API Load Failed");
          }

          const result = await res.json();

          countries = result.data || [];

          render();
        } catch (err) {
          console.error(err);

          alert(err.message || "Load Error");
        }
      }

      // =========================
      // RENDER
      // =========================
      function render() {
        let html = "";

        let mobileHtml = "";

        if (countries.length === 0) {
          html = `
            <tr>
              <td colspan="4" style="text-align:center;">
                No Data
              </td>
            </tr>
          `;

          mobileHtml = `
            <div class="country-box">
              No Data
            </div>
          `;
        }

        countries.forEach((c, i) => {
          const safeName = escapeHtml(c.name || "");
          const safeCode = escapeHtml(c.code || "");

          html += `
            <tr>
              <td>${i + 1}</td>

              <td>${safeName}</td>

              <td>${safeCode}</td>

              <td>
                <button
                  type="button"
                  class="edit-btn"
                  onclick="editCountry('${safeCode}', '${safeName}')"
                >
                  Edit
                </button>

                <button
                  type="button"
                  class="delete-btn"
                  onclick="deleteCountry('${safeCode}')"
                >
                  Delete
                </button>
              </td>
            </tr>
          `;

          mobileHtml += `
            <div class="country-box">
              <b>${safeName}</b>

              <div class="small">
                🌍 Code : ${safeCode}
              </div>

              <div style="margin-top:10px;">
                <button
                  type="button"
                  class="edit-btn"
                  onclick="editCountry('${safeCode}', '${safeName}')"
                >
                  Edit
                </button>

                <button
                  type="button"
                  class="delete-btn"
                  onclick="deleteCountry('${safeCode}')"
                >
                  Delete
                </button>
              </div>
            </div>
          `;
        });

        document.getElementById("countryBody").innerHTML = html;

        document.getElementById("mobileBody").innerHTML = mobileHtml;
      }

      // =========================
      // SAVE
      // =========================
      async function saveCountry() {
        if (saving) return;

        const name = document.getElementById("country_nm").value.trim();

        const code = document
          .getElementById("country_code")
          .value.trim()
          .toUpperCase();

        if (!name || !code) {
          alert("Country name and code are required");
          return;
        }

        saving = true;

        try {
          let response;

          // UPDATE
          if (editCode) {
            response = await fetch(`${API}/${editCode}`, {
              method: "PUT",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                name,
              }),
            });
          }

          // INSERT
          else {
            response = await fetch(API, {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                code,
                name,
              }),
            });
          }

          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error(result.message || "Save failed");
          }

          alert("Saved successfully");

          resetForm();

          await loadCountries();
        } catch (err) {
          console.error(err);

          alert(err.message || "Save Error");
        } finally {
          saving = false;
        }
      }

      // =========================
      // EDIT
      // =========================
      function editCountry(code, name) {
        editCode = code;

        document.getElementById("country_code").value = code;

        document.getElementById("country_nm").value = name;
      }

      // =========================
      // DELETE
      // =========================
      async function deleteCountry(code) {
        if (!confirm("Delete this country?")) return;

        try {
          const response = await fetch(`${API}/${code}`, {
            method: "DELETE",
          });

          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error(result.message || "Delete failed");
          }

          alert("Deleted successfully");

          await loadCountries();

          if (editCode === code) {
            resetForm();
          }
        } catch (err) {
          console.error(err);

          alert(err.message || "Delete Error");
        }
      }

      // =========================
      // RESET
      // =========================
      function resetForm() {
        editCode = null;

        document.getElementById("country_nm").value = "";

        document.getElementById("country_code").value = "";
      }

      // INIT
      loadCountries();
    </script>
  </body>
</html>
