<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KOICA Emergency System</title>

    <style>
      body {
        margin: 0;
        font-family: Arial;
        background: #eef4fb;
      }

      .container {
        max-width: 1100px;
        margin: 80px auto;
        padding: 20px;
      }

      .card {
        background: white;
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 15px;
      }

      select,
      input,
      textarea {
        width: 100%;
        padding: 10px;
        margin: 5px 0;
        border: 1px solid #ccc;
        border-radius: 8px;
      }

      .userbox {
        max-height: 300px;
        overflow: auto;
        border: 1px solid #eee;
      }

      .user-item {
        display: flex;
        justify-content: space-between;
        padding: 8px;
        border-bottom: 1px solid #eee;
      }

      .send {
        width: 100%;
        padding: 18px;
        font-size: 20px;
        background: #d32f2f;
        color: white;
        border: none;
        border-radius: 10px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- COUNTRY -->
      <div class="card">
        <h3>Country</h3>
        <select id="country" onchange="onCountryChange()">
          <option value="all">ALL</option>
        </select>
      </div>

      <!-- REGION -->
      <div class="card" id="regionCard" style="display: none">
        <h3>Region</h3>
        <select id="region" onchange="loadUsers()">
          <option value="all">ALL</option>
        </select>
      </div>

      <!-- ROLE -->
      <div class="card">
        <h3>Role</h3>
        <select id="role" onchange="loadUsers()">
          <option value="all">ALL</option>
          <option value="user">USER</option>
          <option value="staff">STAFF</option>
        </select>
      </div>

      <!-- USERS -->
      <div class="card">
        <h3>Users</h3>
        <div class="userbox" id="userList"></div>
      </div>

      <!-- MESSAGE -->
      <div class="card">
        <h3>Push</h3>

        <input id="title" placeholder="title" />
        <textarea id="body" placeholder="message"></textarea>

        <button class="send" onclick="send()">SEND</button>
      </div>
    </div>

    <script>
      const API = "https://fcm-61ns.onrender.com/api";

      let users = [];
      let selected = [];

      // =====================
      // COUNTRY
      // =====================
      async function loadCountries() {
        const res = await fetch(`${API}/countries`);
        const json = await res.json();

        const sel = document.getElementById("country");

        json.data.forEach((c) => {
          sel.innerHTML += `<option value="${c.code}">${c.name}</option>`;
        });
      }

      // =====================
      // COUNTRY CHANGE
      // =====================
      async function onCountryChange() {
        const country = document.getElementById("country").value;

        const regionCard = document.getElementById("regionCard");
        const regionSel = document.getElementById("region");

        regionSel.innerHTML = `<option value="all">ALL</option>`;
        selected = [];

        if (country === "all") {
          regionCard.style.display = "none";
          await loadUsers();
          return;
        }

        regionCard.style.display = "block";

        const res = await fetch(`${API}/regions?country_code=${country}`);
        const json = await res.json();

        json.data.forEach((r) => {
          regionSel.innerHTML += `<option value="${r.code}">${r.name}</option>`;
        });

        await loadUsers();
      }

      // =====================
      // LOAD USERS (핵심)
      // =====================
      async function loadUsers() {
        const country = document.getElementById("country").value;
        const region = document.getElementById("region")?.value || "all";
        const role = document.getElementById("role").value;

        const url = new URL(`${API}/users/list`);
        url.searchParams.append("country_code", country);
        url.searchParams.append("region_code", region);
        url.searchParams.append("role", role);

        const res = await fetch(url);
        const json = await res.json();

        users = json.data || [];

        render();
      }

      // =====================
      // RENDER
      // =====================
      function render() {
        const box = document.getElementById("userList");

        box.innerHTML = "";

        users.forEach((u) => {
          box.innerHTML += `
      <div class="user-item">
        <span>${u.name} (${u.role})</span>
        <input type="checkbox" onchange="toggle('${u.id}')"/>
      </div>
    `;
        });
      }

      // =====================
      // TOGGLE
      // =====================
      function toggle(id) {
        const u = users.find((x) => x.id === id);

        const idx = selected.findIndex((x) => x.id === id);

        if (idx > -1) selected.splice(idx, 1);
        else selected.push(u);
      }

      // =====================
      // SEND (핵심 수정)
      // =====================
      async function send() {
        const title = document.getElementById("title").value;
        const body = document.getElementById("body").value;

        const targets = selected.length ? selected : users;

        for (const u of targets) {
          const token = u.fcm_token;

          if (!token) continue;

          await fetch(`${API}/fcm/send`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              message: {
                token,
                data: { title, body },
              },
            }),
          });
        }

        alert("sent");
      }

      // =====================
      window.onload = async () => {
        await loadCountries();
        await loadUsers();
      };
    </script>
  </body>
</html>
